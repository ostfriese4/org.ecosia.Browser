app-id: org.ecosia.Browser
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: ecosiabrowser
separate-locales: false

finish-args:
  - --device=all
  - --share=ipc
  - --share=network
  - --socket=cups
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pcsc # FIDO2
  - --socket=pulseaudio
  - --allow=bluetooth # FIDO2 CTAP hybrid transport
  - --system-talk-name=org.bluez
  - --system-talk-name=org.freedesktop.Avahi
  - --system-talk-name=org.freedesktop.UPower
  - --talk-name=com.canonical.AppMenu.Registrar
  - --talk-name=org.freedesktop.FileManager1
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.gnome.SessionManager
  - --talk-name=ca.desrt.dconf
  - --persist=.pki
  - --filesystem=xdg-download
  - --filesystem=xdg-run/pipewire-0
  - --filesystem=xdg-run/dconf
  - --filesystem=~/.config/dconf:ro
  - --filesystem=~/.config/kioslaverc # For KDE proxy resolution (KDE5 only)
  - --env=CHROME_VERSION_EXTRA=stable
  - --env=CHROME_FLAGS=--ozone-platform-hint=auto
  - --env=DCONF_USER_CONFIG_DIR=.config/dconf
  - --env=GIO_EXTRA_MODULES=/app/lib/gio/modules
  - --env=GSETTINGS_BACKEND=dconf
  - --env=CHROME_DESKTOP=org.ecosia.Browser.desktop

modules:
  - name: dconf
    buildsystem: meson
    config-opts:
      - -Dbash_completion=false
      - -Dman=false
      - -Dvapi=false
    cleanup:
      - /etc
      - /include
      - ca.desrt.dconf.service
      - dconf.service
      - dconf-service
      - '*.pc'
    sources:
      - type: archive
        url: https://download.gnome.org/sources/dconf/0.49/dconf-0.49.0.tar.xz
        sha256: 16a47e49a58156dbb96578e1708325299e4c19eea9be128d5bd12fd0963d6c36
        x-checker-data:
          type: gnome
          name: dconf
          stable-only: true
      # from: https://src.fedoraproject.org/rpms/dconf
      - type: patch
        path: dconf-override.patch

  - name: zypak
    sources:
      - type: git
        url: https://github.com/refi64/zypak
        tag: v2025.09
        commit: 693a71c5ffa80ec9c9ce2ae03b1ccc493c698e53
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$

  - shared-modules/squashfs-tools/squashfs-tools.json

  - name: ecosiabrowser-prebuilt
    buildsystem: simple
    build-commands:
      - unsquashfs -quiet -no-progress ecosia.snap
      - mv squashfs-root/app/share/icons /app/share/icons
      - mv squashfs-root/app/share/metainfo /app/share/metainfo
      - mv squashfs-root/opt/ecosia /app/share/ecosia
      - mv squashfs-root/usr/share/applications /app/share/applications
      - mv launch.sh /app/bin/ecosiabrowser
      - chmod +X /app/bin/ecosiabrowser
    sources:
      - type: file
        url: https://api.snapcraft.io/api/v1/snaps/download/2MakkUunZD1vJLykl5QmmVDQAZdE84wY_6.snap
        sha256: f6951358f1afa48e01dcc97761aaf3fc937bc9cc417e8661dd92c1bebca7d62d
        dest-filename: ecosia.snap
        x-checker-data:
          type: snapcraft
          name: ecosia
          channel: stable
          is-main-source: true
      - type: script
        dest-filename: launch.sh
        commands:
          - /app/share/ecosia/chrome --no-sandbox $@
